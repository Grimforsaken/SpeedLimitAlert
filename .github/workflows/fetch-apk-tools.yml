name: Fetch APK patch tools
on:
  push:
    branches: [ original-car-scanner-addon ]
  pull_request:
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
      - name: Download APK signer
        run: curl -L --fail -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-patch-tools
          path: |
            apktool.jar
            uber-apk-signer.jar
