name: Build Cecil Tool

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tools/CecilTool/**'
      - '.github/workflows/cecil-tool.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained inspector
        run: dotnet publish tools/CecilTool/CecilTool.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: CecilTool-linux-x64
          path: out/CecilTool
