name: Build Real Car Scanner Patcher

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'realpatch/**'
      - '.github/workflows/build-real-car-scanner-patcher.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Build runtime and bridge
        run: |
          dotnet build realpatch/SpeedLimitRuntime/SpeedLimitRuntime.csproj -c Release
          dotnet build realpatch/BridgeTemplate/BridgeTemplate.csproj -c Release

      - name: Publish patch tool
        run: |
          dotnet publish realpatch/PatchTool/PatchTool.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o out/tool
          cp realpatch/SpeedLimitRuntime/bin/Release/net9.0/SpeedLimitRuntime.dll out/tool/
          cp realpatch/BridgeTemplate/bin/Release/net9.0/BridgeTemplate.dll out/tool/
          mkdir -p out/tool/android/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/tool/android/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" out/tool/android/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/tool/android/lib/
          chmod +x out/tool/android/zipalign out/tool/android/apksigner

      - uses: actions/upload-artifact@v4
        with:
          name: real-car-scanner-patcher-linux
          path: out/tool/
