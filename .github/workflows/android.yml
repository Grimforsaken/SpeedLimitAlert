name: Inspect Real Car Scanner

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install inspection tools
        run: |
          dotnet tool install --global ilspycmd
          python -m pip install --quiet lz4 pyelftools
          npm install -g @nirewen/apkcombo-downloader

      - name: Download Car Scanner 2.1.3 arm64 APK
        run: |
          apkmd download car-scanner-elm-obd2 com.ovz.carscanner --version 2.1.3 --arch arm64-v8a --dpi nodpi --type apk --outfile carscanner.apk --outdir .
          ls -lh carscanner.apk
          sha256sum carscanner.apk

      - name: Extract MAUI assembly store
        run: |
          mkdir -p inspect/apk inspect/assemblies
          unzip -q carscanner.apk -d inspect/apk
          cp inspect/apk/lib/arm64-v8a/libassemblies.arm64-v8a.blob.so inspect/libassemblies.so
          cat > inspect/extract_store.py <<'PY'
          import struct,sys,os,lz4.block
          from elftools.elf.elffile import ELFFile
          so,out=sys.argv[1],sys.argv[2]
          os.makedirs(out,exist_ok=True)
          with open(so,'rb') as f:
            elf=ELFFile(f); sec=elf.get_section_by_name('payload')
            if sec is None: raise SystemExit('payload section missing')
            d=sec.data()
          if d[:4]!=b'XABA': raise SystemExit('bad XABA magic')
          count=struct.unpack_from('<I',d,8)[0]
          idxsz=struct.unpack_from('<I',d,16)[0]
          pos=20+idxsz
          desc=[]
          for i in range(count):
            vals=struct.unpack_from('<7I',d,pos); pos+=28; desc.append(vals)
          names=[]
          for i in range(count):
            n=struct.unpack_from('<I',d,pos)[0]; pos+=4
            names.append(d[pos:pos+n].decode('utf-8')); pos+=n
          for name,vals in zip(names,desc):
            off,size=vals[1],vals[2]
            b=d[off:off+size]
            if b[:4]==b'XALZ':
              usize=struct.unpack_from('<I',b,8)[0]
              b=lz4.block.decompress(b[12:],uncompressed_size=usize)
            fn=name if name.endswith('.dll') else name+'.dll'
            open(os.path.join(out,fn),'wb').write(b)
          print('assemblies',count)
          PY
          python inspect/extract_store.py inspect/libassemblies.so inspect/assemblies
          ls -lh inspect/assemblies/CarScannerMaui*.dll

      - name: Decompile CarScannerMaui
        run: |
          mkdir -p inspect/decompiled
          ilspycmd -l c inspect/assemblies/CarScannerMaui.dll > inspect/types.txt
          grep -Ei 'GPS|Dashboard|Sensor|PID|Speed|Limit|Setting|Location' inspect/types.txt > inspect/relevant-types.txt || true
          ilspycmd -p -o inspect/decompiled inspect/assemblies/CarScannerMaui.dll
          grep -RilE 'PID_GPSSpeed|GPS_SPEED|DashboardItem_Act_SelectSensor|DashboardItemEditor_TapToSelectSensor|Speed limiter' inspect/decompiled > inspect/hits.txt || true
          echo '=== hits ==='
          cat inspect/hits.txt || true

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarScanner-real-decompile
          path: |
            inspect/types.txt
            inspect/relevant-types.txt
            inspect/hits.txt
            inspect/decompiled
          compression-level: 9
