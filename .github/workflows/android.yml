name: Build MAUI Tools

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained decompiler
        run: |
          mkdir -p tools/DecompilerTool
          cd tools/DecompilerTool
          dotnet new console -f net10.0 --force
          dotnet add package ICSharpCode.Decompiler --version 11.1.0.9782
          cat > Program.cs <<'CS'
          using System;
          using System.IO;
          using ICSharpCode.Decompiler;
          using ICSharpCode.Decompiler.CSharp;
          using ICSharpCode.Decompiler.TypeSystem;

          if (args.Length < 2) {
              Console.Error.WriteLine("usage: DecompilerTool <assembly> <output.cs> [full.type.name]");
              return 2;
          }
          var input = Path.GetFullPath(args[0]);
          var output = Path.GetFullPath(args[1]);
          var settings = new DecompilerSettings { ThrowOnAssemblyResolveErrors = false };
          var d = new CSharpDecompiler(input, settings);
          string text = args.Length >= 3
              ? d.DecompileTypeAsString(new FullTypeName(args[2]))
              : d.DecompileWholeModuleAsString();
          File.WriteAllText(output, text);
          Console.WriteLine(output);
          return 0;
          CS
          dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o ../../out/decompiler

      - name: Build self-contained dnlib inspector
        run: |
          mkdir -p tools/DnInspect
          cd tools/DnInspect
          dotnet new console -f net10.0 --force
          dotnet add package dnlib --version 4.5.0
          cat > Program.cs <<'CS'
          using System;
          using System.Linq;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;

          if (args.Length < 1) return 2;
          var filter = args.Length > 1 ? args[1] : "";
          var m = ModuleDefMD.Load(args[0]);
          foreach (var t in m.GetTypes()) {
            if (!string.IsNullOrEmpty(filter) && !t.FullName.Contains(filter, StringComparison.OrdinalIgnoreCase)) continue;
            Console.WriteLine("TYPE " + t.FullName);
            foreach (var md in t.Methods) {
              Console.WriteLine("METHOD " + md.FullName);
              if (md.HasBody) foreach (var ins in md.Body.Instructions)
                Console.WriteLine($"  {ins.Offset:X4}: {ins.OpCode} {ins.Operand}");
            }
            foreach (var f in t.Fields) Console.WriteLine("FIELD " + f.FullName);
          }
          return 0;
          CS
          dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o ../../out/dninspect

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: maui-patch-tools-v2
          path: out
          compression-level: 0
