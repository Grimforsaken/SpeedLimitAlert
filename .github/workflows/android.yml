name: Tool Bootstrap

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download self-contained ILSpy for Linux
        run: |
          curl -fL --retry 4 --retry-delay 2 \
            -o ILSpy_linux-x64.zip \
            https://github.com/icsharpcode/ILSpy/releases/download/v11.1/ILSpy_linux-x64_11.1.0.9782.zip
          unzip -q ILSpy_linux-x64.zip -d ilspy
          find ilspy -maxdepth 2 -type f | head -40
      - name: Upload ILSpy
        uses: actions/upload-artifact@v4
        with:
          name: ilspy-linux-x64
          path: ilspy
          compression-level: 0
